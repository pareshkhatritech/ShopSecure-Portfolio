
services:
  frontend:
    build:
      context: ./web-app/frontend
      args:
        VITE_API_URL: ""
        VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./web-app/backend
    container_name: backend
    expose:
      - "3000"
    environment:
      DB_HOST: database
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?TURNSTILE_SECRET is required}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: database
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

networks:
  default:
    driver: bridge
